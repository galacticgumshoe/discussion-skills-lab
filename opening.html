<body class="w-full dsl-opening" data-template-id="__page-root">
<div class="shell w-full app-shell"><header class="topbar"><div class="max-w-[1320px] mx-auto px-7 py-5 flex flex-wrap justify-between items-center gap-3"><div><div class="brand">DISCUSSION SKILLS LAB · MSHSL SPEECH</div><div class="font-semibold mt-1">Starting Strong · The Opening Stage</div></div><div class="text-sm rounded-full px-4 py-2 border border-white/30">SELF-PACED · 15–20 MINUTES</div></div></header>

<div class="dsl-layout" id="layout"><nav aria-label="Lesson sections" class="rail" id="rail"><button aria-expanded="true" aria-label="Collapse navigation" class="rail-toggle" id="rail-toggle" type="button">⇤</button><div class="rail-progress"><div class="eyebrow" style="color:var(--dsl-teal)">YOUR PROGRESS</div><div aria-live="polite" class="font-bold mt-2" id="progress-text">0 of 7 pages completed</div><div aria-label="Completed lesson pages" aria-valuemax="7" aria-valuemin="0" aria-valuenow="0" class="top-progress mt-3 rounded-full overflow-hidden" id="progress-track" role="progressbar"><div id="progress-fill"></div></div><p class="text-sm mt-4" style="color:#506176">Finish each activity to unlock the next page. Quick reference is always available.</p></div><div id="rail-links"></div></nav>

<main class="dsl-content" id="lesson-main"><div class="mobile-nav"><label for="section-select">Go to a section</label><select id="section-select"></select></div><p aria-live="polite" id="nav-status" role="status"></p>
<div class="w-full">
<p id="lesson-status" role="status">Lesson is loading.</p><button id="lesson-retry" type="button" hidden>Retry lesson</button><p id="storage-warning" role="status" hidden></p><div id="views"></div>
<div class="bottom-controls flex justify-between gap-3 border-t border-[#d6e5ed] mt-9 pt-5"><button class="secondary" id="previous-section" type="button">← Previous</button> <button class="action" id="next-section" type="button">Next section →</button>
</div>
</div>
